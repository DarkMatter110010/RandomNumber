<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>抽号器网页版</title>
  <style>
    body {
      font-family: "微软雅黑", sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .input-group {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }
    label {
      width: 60px;
      text-align: right;
      margin-right: 10px;
      font-size: 16px;
    }
    input[type="number"] {
      width: 80px;
      padding: 8px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 10px 15px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      margin: 5px;
    }
    button.primary {
      background-color: #4CAF50;
      color: white;
    }
    button.secondary {
      background-color: #2196F3;
      color: white;
    }
    .result {
      font-size: 70px;
      text-align: center;
      height: 150px;
      line-height: 150px;
      margin: 20px 0;
      background: #eee;
      border-radius: 8px;
      font-weight: bold;
      overflow: hidden;
    }
    /* 模态框样式 */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: white;
      width: 90%;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .scale-item {
      display: flex;
      align-items: center;
      margin: 10px 0;
    }
    .scale-item label {
      width: 40px;
    }
    input[type="range"] {
      width: 300px;
    }
    .modal-footer {
      text-align: right;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>抽号器网页版</h2>

  <div class="input-group">
    <label for="min">起始值：</label>
    <input type="number" id="min" value="1" />
    <label for="max" style="margin-left: 20px;">终止值：</label>
    <input type="number" id="max" value="10" />
  </div>

  <div class="result" id="result">?</div>

  <button class="secondary" id="editProb">编辑概率</button>
  <button class="primary" id="pick">抽号</button>
</div>

<!-- 概率编辑模态框 -->
<div class="modal" id="probModal">
  <div class="modal-content">
    <h3>编辑概率（权重）</h3>
    <p>滑动滑块设置每个数字被抽中的相对概率（权重）</p>
    <div id="scalesContainer"></div>
    <div class="modal-footer">
      <button id="saveProb">保存</button>
      <button id="closeModal">关闭</button>
    </div>
  </div>
</div>

<script>
// 存储键名
const RANGE_KEY = 'number_picker_range';
const PROB_KEY = 'number_picker_probs';

// 页面元素
const minInput = document.getElementById('min');
const maxInput = document.getElementById('max');
const resultDiv = document.getElementById('result');
const pickBtn = document.getElementById('pick');
const editProbBtn = document.getElementById('editProb');
const modal = document.getElementById('probModal');
const closeModal = document.getElementById('closeModal');
const saveProb = document.getElementById('saveProb');
const scalesContainer = document.getElementById('scalesContainer');

// 概率权重数组
let probEntries = [];

// 从 localStorage 加载设置
function loadSettings() {
  const savedRange = localStorage.getItem(RANGE_KEY);
  if (savedRange) {
    const [min, max] = savedRange.split(',').map(Number);
    minInput.value = min;
    maxInput.value = max;
  }

  const savedProbs = localStorage.getItem(PROB_KEY);
  if (savedProbs) {
    probEntries = JSON.parse(savedProbs);
  }
}

// 保存当前范围
function saveSettings() {
  const min = parseInt(minInput.value);
  const max = parseInt(maxInput.value);
  localStorage.setItem(RANGE_KEY, `${min},${max}`);
}

// 初始化概率数组
function initProbabilities(min, max) {
  const count = max - min + 1;
  if (!probEntries.length || probEntries.length !== count) {
    probEntries = Array(count).fill(1); // 默认权重为1
  }
}

// 打开概率编辑器
function openProbEditor() {
  const min = parseInt(minInput.value);
  const max = parseInt(maxInput.value);

  if (isNaN(min) || isNaN(max) || min >= max) {
    alert("数值异常，请输入有效的起始值和终止值！");
    return;
  }

  initProbabilities(min, max);

  scalesContainer.innerHTML = '';
  for (let i = min; i <= max; i++) {
    const idx = i - min;
    const item = document.createElement('div');
    item.className = 'scale-item';
    item.innerHTML = `
      <label>${i}:</label>
      <input type="range" min="0" max="50" value="${probEntries[idx]}" class="prob-scale" data-index="${idx}">
      <span class="value-display">${probEntries[idx]}</span>
    `;
    scalesContainer.appendChild(item);

    // 实时更新显示值
    const slider = item.querySelector('.prob-scale');
    const display = item.querySelector('.value-display');
    slider.addEventListener('input', () => {
      display.textContent = slider.value;
      probEntries[slider.dataset.index] = parseInt(slider.value);
    });
  }

  modal.style.display = 'flex';
}

// 保存概率
function saveProbabilities() {
  localStorage.setItem(PROB_KEY, JSON.stringify(probEntries));
  alert("概率设置已保存！");
  modal.style.display = 'none';
}

// 抽号逻辑（加权随机）
function pickNumber() {
  const min = parseInt(minInput.value);
  const max = parseInt(maxInput.value);

  if (isNaN(min) || isNaN(max)) {
    alert("请输入有效的数字！");
    return;
  }

  if (min >= max) {
    alert("起始值必须小于终止值！");
    return;
  }

  initProbabilities(min, max);

  // 构建加权列表
  let pool = [];
  for (let i = min; i <= max; i++) {
    const weight = probEntries[i - min];
    for (let j = 0; j < weight; j++) {
      pool.push(i);
    }
  }

  if (pool.length === 0) {
    alert("所有概率都为0，请调整后再试！");
    return;
  }

  const randomIndex = Math.floor(Math.random() * pool.length);
  const picked = pool[randomIndex];
  resultDiv.textContent = picked;

  saveSettings(); // 保存当前范围
}

// 事件绑定
editProbBtn.addEventListener('click', openProbEditor);
pickBtn.addEventListener('click', pickNumber);
closeModal.addEventListener('click', () => { modal.style.display = 'none'; });
saveProb.addEventListener('click', saveProbabilities);

// 初始化
loadSettings();
initProbabilities(parseInt(minInput.value), parseInt(maxInput.value));
</script>

</body>
</html>
